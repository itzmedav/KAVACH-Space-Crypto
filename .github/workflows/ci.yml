name: KAVACH Post-Quantum CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential liboqs-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install liboqs-python cryptography pytest

      - name: Execute KAVACH Test Suite
        run: |
          pytest test_kavach.py -v
