[platformio]
default_envs = kavach_satellite

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.4

[env:kavach_satellite]
build_flags = 
    -D KAVACH_ROLE_SATELLITE
    -D BOARD_HAS_PSRAM
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

[env:kavach_ground]
build_flags = 
    -D KAVACH_ROLE_GROUND
    -D BOARD_HAS_PSRAM
